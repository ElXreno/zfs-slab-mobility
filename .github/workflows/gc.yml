name: cache-gc

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31.11.1
      - uses: Mic92/hestia/gc@v3
